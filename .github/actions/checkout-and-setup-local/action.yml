name: 'Checkout and Setup (Local)'
description: 'Local replacement for MetaMask/action-checkout-and-setup using Corepack'
inputs:
  skip-allow-scripts:
    description: 'Skip yarn allow-scripts step'
    required: false
    default: 'false'
  is-high-risk-environment:
    description: 'Whether this is a high risk environment'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup environment with Corepack
      uses: ./.github/actions/setup-yarn-with-corepack
      with:
        node-version: '22.15'
        yarn-version: '4.9.1'
        skip-install: 'false'

    - name: Run allow-scripts
      if: ${{ inputs.skip-allow-scripts != 'true' }}
      shell: bash
      run: |
        yarn allow-scripts auto